<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo/milai-frame/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>milai边框</title>
    
    <link rel="stylesheet" href="/logo/milai-frame/assets/index.cfa8e624.css">
    
    <!-- ===== 立体阴影样式 ===== -->
    <style>
        /* 阴影容器 - 包裹 canvas 的父容器 */
        .shadow-wrapper-3d {
            position: relative !important;
            z-index: 1 !important;
            display: inline-block !important;
        }
        
        /* 阴影叠加层 - 通过伪元素实现立体阴影 */
        .shadow-wrapper-3d::after {
            content: '' !important;
            position: absolute !important;
            top: 6px !important;
            left: 6px !important;
            right: -6px !important;
            bottom: -6px !important;
            border-radius: 4px !important;
            background: transparent !important;
            box-shadow: 
                0 8px 40px rgba(0, 0, 0, 0.35),
                0 4px 20px rgba(0, 0, 0, 0.20),
                0 0 0 4px rgba(255, 255, 255, 0.85) !important;
            pointer-events: none !important;
            z-index: -1 !important;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
            opacity: 0 !important;
        }
        
        /* 激活时显示阴影 */
        .shadow-wrapper-3d.active::after {
            opacity: 1 !important;
        }
        
        /* 悬停增强 */
        .shadow-wrapper-3d.active:hover::after {
            box-shadow: 
                0 12px 50px rgba(0, 0, 0, 0.40),
                0 6px 28px rgba(0, 0, 0, 0.25),
                0 0 0 4px rgba(255, 255, 255, 0.95) !important;
        }
        
        /* 确保 canvas 不受影响 */
        .shadow-wrapper-3d canvas {
            position: relative !important;
            z-index: 1 !important;
        }
        
        /* 控制开关样式 */
        .shadow-control-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            margin-left: 12px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.25s ease;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        
        .shadow-control-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.15);
            transform: translateY(-1px);
        }
        
        .shadow-control-btn.active {
            background: rgba(74, 222, 128, 0.20);
            border-color: rgba(74, 222, 128, 0.40);
            color: #16a34a;
        }
        
        .shadow-control-btn .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .shadow-control-btn.active .indicator {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.40);
        }
        
        /* 备选悬浮按钮 */
        .shadow-float-btn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(20, 20, 20, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.10);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .shadow-float-btn:hover {
            transform: translateX(-50%) scale(1.04);
            background: rgba(30, 30, 30, 0.85);
        }
        
        .shadow-float-btn.active {
            background: rgba(0, 180, 80, 0.75);
            border-color: rgba(0, 255, 120, 0.20);
        }
        
        .shadow-float-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .shadow-float-btn.active .dot {
            background: #4ade80;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.50);
        }
        
        @media (max-width: 640px) {
            .shadow-float-btn {
                bottom: 16px;
                padding: 8px 18px;
                font-size: 12px;
                border-radius: 24px;
            }
        }
    </style>
    <!-- ===== 样式结束 ===== -->
    
    <link rel="modulepreload" crossorigin href="/logo/milai-frame/assets/vendor.6ae0475c.js">
    <script type="module" crossorigin src="/logo/milai-frame/assets/index.796dc854.js"></script>
    
  </head>

  <body>
    <div id="app"></div>
    
    <!-- ===== 立体阴影控制逻辑 ===== -->
    <script>
        (function() {
            'use strict';
            
            const CONFIG = {
                retryInterval: 400,
                maxRetries: 30,
                debug: true
            };
            
            let isActive = false;
            let isInitialized = false;
            let controlBtn = null;
            let floatBtn = null;
            let retryCount = 0;
            let wrapperEl = null;      // 我们创建的包裹容器
            let canvasEl = null;
            let imageRenderEl = null;
            
            function log(...args) {
                if (CONFIG.debug) console.log('[立体阴影]', ...args);
            }
            
            // --- 查找 Canvas ---
            function findCanvas() {
                const app = document.querySelector('#app');
                if (!app) return null;
                return app.querySelector('canvas.canvas');
            }
            
            // --- 创建包裹容器 ---
            function createWrapper(canvas) {
                if (!canvas) return null;
                
                // 如果已经有包裹容器了，直接返回
                let parent = canvas.parentElement;
                if (parent && parent.classList.contains('shadow-wrapper-3d')) {
                    return parent;
                }
                
                // 获取 canvas 的父容器 .image-render
                imageRenderEl = canvas.closest('.image-render') || canvas.parentElement;
                
                // 在 .image-render 中创建一个包裹层
                const wrapper = document.createElement('div');
                wrapper.className = 'shadow-wrapper-3d';
                wrapper.style.cssText = `
                    position: relative !important;
                    display: inline-block !important;
                    z-index: 1 !important;
                    width: 100% !important;
                    height: 100% !important;
                `;
                
                // 将 canvas 移动到 wrapper 中
                canvas.parentElement.insertBefore(wrapper, canvas);
                wrapper.appendChild(canvas);
                
                log('已创建包裹容器');
                return wrapper;
            }
            
            // --- 应用阴影 ---
            function applyShadow() {
                if (!wrapperEl) {
                    const canvas = findCanvas();
                    if (!canvas) return false;
                    wrapperEl = createWrapper(canvas);
                    canvasEl = canvas;
                    if (!wrapperEl) return false;
                }
                
                // 直接通过类控制
                if (isActive) {
                    wrapperEl.classList.add('active');
                } else {
                    wrapperEl.classList.remove('active');
                }
                
                log('阴影状态:', isActive ? '开启 ✅' : '关闭 ❌');
                return true;
            }
            
            // --- 切换阴影 ---
            function toggleShadow() {
                if (!wrapperEl || !canvasEl) {
                    const canvas = findCanvas();
                    if (!canvas) {
                        log('找不到 Canvas');
                        return;
                    }
                    wrapperEl = createWrapper(canvas);
                    canvasEl = canvas;
                    if (!wrapperEl) return;
                }
                
                isActive = !isActive;
                applyShadow();
                
                // 更新按钮
                if (controlBtn) {
                    controlBtn.classList.toggle('active', isActive);
                }
                if (floatBtn) {
                    floatBtn.classList.toggle('active', isActive);
                }
            }
            
            // --- 集成到功能面板 ---
            function tryIntegrateToPanel() {
                const controlArea = document.querySelector('.control-area');
                if (!controlArea) {
                    log('未找到 .control-area');
                    return false;
                }
                
                if (controlArea.querySelector('.shadow-control-btn')) {
                    return true;
                }
                
                let insertTarget = controlArea;
                const items = controlArea.querySelectorAll('*');
                for (let el of items) {
                    if (el.textContent && el.textContent.includes('边框')) {
                        insertTarget = el.parentElement || controlArea;
                        break;
                    }
                }
                
                controlBtn = document.createElement('span');
                controlBtn.className = 'shadow-control-btn';
                controlBtn.innerHTML = `
                    <span class="indicator"></span>
                    <span>立体阴影</span>
                `;
                controlBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                insertTarget.appendChild(controlBtn);
                log('已集成到功能面板');
                return true;
            }
            
            // --- 创建悬浮按钮 ---
            function createFloatButton() {
                const old = document.querySelector('.shadow-float-btn');
                if (old) old.remove();
                
                floatBtn = document.createElement('div');
                floatBtn.className = 'shadow-float-btn';
                floatBtn.innerHTML = `
                    <span>🔲</span>
                    <span>立体阴影</span>
                    <span class="dot"></span>
                `;
                floatBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                document.body.appendChild(floatBtn);
                log('已创建悬浮按钮');
                return floatBtn;
            }
            
            // --- 监听外边框 ---
            function watchOuterBorder() {
                document.addEventListener('click', function(e) {
                    const target = e.target;
                    if (!target) return;
                    
                    const text = target.textContent || '';
                    if (text.includes('使用外边框') || text.includes('外边框')) {
                        setTimeout(() => {
                            // 检查 canvas 是否有边框
                            if (canvasEl) {
                                const style = window.getComputedStyle(canvasEl);
                                const hasBorder = 
                                    style.borderWidth !== '0px' ||
                                    style.border !== 'none' ||
                                    style.outline !== 'none';
                                
                                if (hasBorder && !isActive) {
                                    log('检测到外边框开启，自动激活立体阴影');
                                    toggleShadow();
                                }
                            }
                        }, 500);
                    }
                });
            }
            
            // --- 初始化 ---
            function init() {
                if (isInitialized) return;
                
                retryCount++;
                log(`尝试 ${retryCount}/${CONFIG.maxRetries}`);
                
                const canvas = findCanvas();
                if (!canvas) {
                    if (retryCount < CONFIG.maxRetries) {
                        setTimeout(init, CONFIG.retryInterval);
                    } else {
                        log('初始化超时');
                    }
                    return;
                }
                
                canvasEl = canvas;
                wrapperEl = createWrapper(canvas);
                
                if (!wrapperEl) {
                    log('创建包裹容器失败');
                    return;
                }
                
                // 默认关闭状态
                wrapperEl.classList.remove('active');
                
                // 集成到面板
                const integrated = tryIntegrateToPanel();
                if (!integrated) {
                    createFloatButton();
                }
                
                watchOuterBorder();
                
                // 暴露调试接口
                window.__shadow3d = {
                    toggle: toggleShadow,
                    enable: () => { if (!isActive) toggleShadow(); },
                    disable: () => { if (isActive) toggleShadow(); },
                    status: () => isActive,
                    _elements: { wrapper: wrapperEl, canvas: canvasEl }
                };
                
                isInitialized = true;
                log('初始化完成！');
                log('点击"立体阴影"开关或执行 window.__shadow3d.toggle()');
            }
            
            // --- 启动 ---
            if (document.readyState === 'complete') {
                setTimeout(init, 600);
            } else {
                document.addEventListener('readystatechange', () => {
                    if (document.readyState === 'complete') {
                        setTimeout(init, 600);
                    }
                });
            }
            
            // 路由变化重新绑定
            window.addEventListener('popstate', () => {
                setTimeout(() => {
                    if (isInitialized) {
                        const canvas = findCanvas();
                        if (canvas && canvas !== canvasEl) {
                            canvasEl = canvas;
                            wrapperEl = createWrapper(canvas);
                            if (isActive) {
                                wrapperEl?.classList.add('active');
                            }
                            log('路由变化，重新绑定');
                        }
                    }
                }, 400);
            });
            
        })();
    </script>
    <!-- ===== 控制逻辑结束 ===== -->
    
  </body>
</html>
