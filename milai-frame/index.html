<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo/milai-frame/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>milai边框</title>
    
    <link rel="stylesheet" href="/logo/milai-frame/assets/index.cfa8e624.css">
    
    <!-- ===== 立体阴影样式 ===== -->
    <style>
        /* 对 canvas 的父容器应用阴影 */
        .shadow-3d-active .image-render {
            position: relative !important;
            z-index: 1 !important;
        }
        
        /* 主要阴影效果 - 应用到包含 canvas 的容器 */
        .shadow-3d-active .image-render canvas,
        .shadow-3d-active .image-render .canvas-wrapper {
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.35))
                    drop-shadow(0 4px 16px rgba(0, 0, 0, 0.20))
                    drop-shadow(0 0 0 3px rgba(255, 255, 255, 0.85));
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* 悬停增强效果 */
        .shadow-3d-active .image-render canvas:hover,
        .shadow-3d-active .image-render .canvas-wrapper:hover {
            filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.40))
                    drop-shadow(0 6px 20px rgba(0, 0, 0, 0.25))
                    drop-shadow(0 0 0 3px rgba(255, 255, 255, 0.95));
            transform: scale(1.005);
        }
        
        /* 对 .image-render 容器本身也加一点效果 */
        .shadow-3d-active .image-render {
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.05));
        }
        
        /* 立体阴影开关 - 集成到底部 */
        .shadow-control-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            margin-left: 12px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.25s ease;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        
        .shadow-control-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.15);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        
        .shadow-control-btn.active {
            background: rgba(74, 222, 128, 0.20);
            border-color: rgba(74, 222, 128, 0.40);
            color: #16a34a;
        }
        
        .shadow-control-btn .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s ease;
        }
        
        .shadow-control-btn.active .indicator {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.40);
        }
        
        /* 备选悬浮按钮（如果无法集成到面板） */
        .shadow-float-btn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(20, 20, 20, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.10);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .shadow-float-btn:hover {
            transform: translateX(-50%) scale(1.04);
            background: rgba(30, 30, 30, 0.85);
        }
        
        .shadow-float-btn.active {
            background: rgba(0, 180, 80, 0.75);
            border-color: rgba(0, 255, 120, 0.20);
        }
        
        .shadow-float-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }
        
        .shadow-float-btn.active .dot {
            background: #4ade80;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.50);
        }
        
        @media (max-width: 640px) {
            .shadow-float-btn {
                bottom: 16px;
                padding: 8px 18px;
                font-size: 12px;
                border-radius: 24px;
            }
        }
    </style>
    <!-- ===== 样式结束 ===== -->
    
    <link rel="modulepreload" crossorigin href="/logo/milai-frame/assets/vendor.6ae0475c.js">
    <script type="module" crossorigin src="/logo/milai-frame/assets/index.796dc854.js"></script>
    
  </head>

  <body>
    <div id="app"></div>
    
    <!-- ===== 立体阴影控制逻辑 ===== -->
    <script>
        (function() {
            'use strict';
            
            // --- 配置 ---
            const CONFIG = {
                retryInterval: 400,
                maxRetries: 25,
                debug: true
            };
            
            let isActive = false;
            let isInitialized = false;
            let controlBtn = null;
            let floatBtn = null;
            let retryCount = 0;
            let imageRenderEl = null;
            let canvasEl = null;
            
            function log(...args) {
                if (CONFIG.debug) console.log('[立体阴影]', ...args);
            }
            
            // --- 查找 Canvas 和其父容器 ---
            function findCanvasElements() {
                const app = document.querySelector('#app');
                if (!app) {
                    log('未找到 #app');
                    return null;
                }
                
                // 查找 canvas 元素
                const canvas = app.querySelector('canvas.canvas');
                if (!canvas) {
                    log('未找到 canvas.canvas 元素');
                    return null;
                }
                
                log('找到 canvas:', canvas);
                
                // 查找 .image-render 容器
                let imageRender = canvas.closest('.image-render');
                if (!imageRender) {
                    // 尝试其他方式查找
                    imageRender = app.querySelector('.image-render');
                }
                
                if (!imageRender) {
                    log('未找到 .image-render 容器');
                    // 如果找不到，使用 canvas 的父级
                    imageRender = canvas.parentElement;
                }
                
                log('找到 .image-render:', imageRender);
                
                return {
                    canvas: canvas,
                    imageRender: imageRender || canvas.parentElement
                };
            }
            
            // --- 应用阴影 ---
            function applyShadowToCanvas(elements) {
                if (!elements) return false;
                
                // 清除之前的标记
                document.querySelectorAll('.shadow-3d-active').forEach(el => {
                    el.classList.remove('shadow-3d-active');
                });
                
                // 对 .image-render 容器添加标记
                elements.imageRender.classList.add('shadow-3d-active');
                
                // 如果之前是激活状态，恢复
                if (isActive) {
                    elements.imageRender.classList.add('shadow-3d-active');
                    // 触发重绘以确保阴影生效
                    elements.imageRender.style.transform = 'translateZ(0)';
                    requestAnimationFrame(() => {
                        elements.imageRender.style.transform = '';
                    });
                }
                
                imageRenderEl = elements.imageRender;
                canvasEl = elements.canvas;
                
                log('阴影已应用到 .image-render');
                return true;
            }
            
            // --- 切换阴影 ---
            function toggleShadow() {
                if (!imageRenderEl) {
                    log('目标不存在，重新查找...');
                    const elements = findCanvasElements();
                    if (!elements) {
                        log('无法找到目标元素');
                        return;
                    }
                    applyShadowToCanvas(elements);
                }
                
                isActive = !isActive;
                
                if (isActive) {
                    imageRenderEl.classList.add('shadow-3d-active');
                } else {
                    imageRenderEl.classList.remove('shadow-3d-active');
                }
                
                // 更新按钮状态
                if (controlBtn) {
                    controlBtn.classList.toggle('active', isActive);
                }
                if (floatBtn) {
                    floatBtn.classList.toggle('active', isActive);
                }
                
                log('阴影状态:', isActive ? '开启 ✅' : '关闭 ❌');
            }
            
            // --- 尝试集成到功能面板 ---
            function tryIntegrateToPanel() {
                // 查找控制区域
                const controlArea = document.querySelector('.control-area');
                if (!controlArea) {
                    log('未找到 .control-area');
                    return false;
                }
                
                // 检查是否已有我们的按钮
                if (controlArea.querySelector('.shadow-control-btn')) {
                    return true;
                }
                
                // 查找 "边框" 相关元素，在其后面添加
                const borderElements = controlArea.querySelectorAll('*');
                let insertTarget = controlArea;
                
                for (let el of borderElements) {
                    if (el.textContent && el.textContent.includes('边框')) {
                        insertTarget = el.parentElement || controlArea;
                        break;
                    }
                }
                
                // 创建控制按钮
                controlBtn = document.createElement('span');
                controlBtn.className = 'shadow-control-btn';
                controlBtn.innerHTML = `
                    <span class="indicator"></span>
                    <span>立体阴影</span>
                `;
                
                controlBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                // 插入到控制区域
                insertTarget.appendChild(controlBtn);
                log('已集成到功能面板');
                return true;
            }
            
            // --- 创建悬浮按钮（备选） ---
            function createFloatButton() {
                // 移除旧的
                const old = document.querySelector('.shadow-float-btn');
                if (old) old.remove();
                
                floatBtn = document.createElement('div');
                floatBtn.className = 'shadow-float-btn';
                floatBtn.innerHTML = `
                    <span>🔲</span>
                    <span>立体阴影</span>
                    <span class="dot"></span>
                `;
                
                floatBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                document.body.appendChild(floatBtn);
                log('已创建悬浮按钮');
                return floatBtn;
            }
            
            // --- 监听外边框开关 ---
            function watchOuterBorder() {
                const app = document.querySelector('#app');
                if (!app) return;
                
                // 监听点击事件
                document.addEventListener('click', function(e) {
                    const target = e.target;
                    if (!target) return;
                    
                    // 检查是否点击了"使用外边框"相关元素
                    const text = target.textContent || '';
                    if (text.includes('使用外边框') || text.includes('外边框')) {
                        // 延迟执行，等待状态变化
                        setTimeout(() => {
                            // 检查是否有外边框开启的迹象
                            if (imageRenderEl) {
                                // 检查 canvas 或其父元素是否有边框相关样式
                                const hasBorder = 
                                    canvasEl?.style?.border !== '' ||
                                    imageRenderEl?.style?.border !== '' ||
                                    imageRenderEl?.classList?.contains('border') ||
                                    imageRenderEl?.classList?.contains('has-border');
                                
                                if (hasBorder && !isActive) {
                                    log('检测到外边框开启，自动激活立体阴影');
                                    toggleShadow();
                                }
                            }
                        }, 500);
                    }
                });
            }
            
            // --- 初始化 ---
            function init() {
                if (isInitialized) {
                    log('已初始化');
                    return;
                }
                
                retryCount++;
                log(`尝试 ${retryCount}/${CONFIG.maxRetries}`);
                
                const elements = findCanvasElements();
                if (!elements) {
                    if (retryCount < CONFIG.maxRetries) {
                        setTimeout(init, CONFIG.retryInterval);
                    } else {
                        log('初始化失败：超时');
                    }
                    return;
                }
                
                // 应用阴影
                applyShadowToCanvas(elements);
                
                // 尝试集成到面板
                const integrated = tryIntegrateToPanel();
                if (!integrated) {
                    // 如果无法集成，使用悬浮按钮
                    createFloatButton();
                }
                
                // 监听外边框
                watchOuterBorder();
                
                // 暴露调试接口
                window.__shadow3d = {
                    toggle: toggleShadow,
                    enable: () => { if (!isActive) toggleShadow(); },
                    disable: () => { if (isActive) toggleShadow(); },
                    status: () => isActive,
                    find: findCanvasElements,
                    apply: applyShadowToCanvas,
                    _elements: { imageRender: imageRenderEl, canvas: canvasEl }
                };
                
                isInitialized = true;
                log('初始化完成！使用 window.__shadow3d 控制');
                log('提示：如果看不到效果，在控制台执行 window.__shadow3d.toggle()');
            }
            
            // --- 启动 ---
            if (document.readyState === 'complete') {
                setTimeout(init, 600);
            } else {
                document.addEventListener('readystatechange', function() {
                    if (document.readyState === 'complete') {
                        setTimeout(init, 600);
                    }
                });
            }
            
            // 路由变化重新绑定
            window.addEventListener('popstate', function() {
                setTimeout(() => {
                    if (isInitialized) {
                        const elements = findCanvasElements();
                        if (elements) {
                            applyShadowToCanvas(elements);
                            if (isActive) {
                                imageRenderEl.classList.add('shadow-3d-active');
                            }
                            log('路由变化，重新绑定');
                        }
                    }
                }, 400);
            });
            
        })();
    </script>
    <!-- ===== 控制逻辑结束 ===== -->
    
  </body>
</html>
