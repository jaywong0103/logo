<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo/milai-frame/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>milai边框</title>
    
    <link rel="stylesheet" href="/logo/milai-frame/assets/index.cfa8e624.css">
    
    <!-- ===== 立体阴影样式（增强版） ===== -->
    <style>
        /* 核心：对 Canvas 应用阴影 */
        .shadow-3d-active canvas.canvas {
            filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.40))
                    drop-shadow(0 4px 16px rgba(0, 0, 0, 0.25))
                    drop-shadow(0 0 0 4px rgba(255, 255, 255, 0.90)) !important;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }
        
        /* 悬停增强 */
        .shadow-3d-active canvas.canvas:hover {
            filter: drop-shadow(0 12px 44px rgba(0, 0, 0, 0.45))
                    drop-shadow(0 6px 24px rgba(0, 0, 0, 0.30))
                    drop-shadow(0 0 0 4px rgba(255, 255, 255, 0.95)) !important;
            transform: scale(1.008) !important;
        }
        
        /* 确保 Canvas 保持原有样式 */
        .shadow-3d-active .image-render {
            position: relative !important;
            z-index: 1 !important;
            padding: 4px !important;
        }
        
        /* 立体阴影开关样式 */
        .shadow-control-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            margin-left: 12px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            font-size: 13px;
            color: #555;
            transition: all 0.25s ease;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        
        .shadow-control-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.15);
            transform: translateY(-1px);
        }
        
        .shadow-control-btn.active {
            background: rgba(74, 222, 128, 0.20);
            border-color: rgba(74, 222, 128, 0.40);
            color: #16a34a;
        }
        
        .shadow-control-btn .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s ease;
        }
        
        .shadow-control-btn.active .indicator {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.40);
        }
        
        /* 备选悬浮按钮 */
        .shadow-float-btn {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(20, 20, 20, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.30);
            border: 1px solid rgba(255, 255, 255, 0.10);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .shadow-float-btn:hover {
            transform: translateX(-50%) scale(1.04);
            background: rgba(30, 30, 30, 0.85);
        }
        
        .shadow-float-btn.active {
            background: rgba(0, 180, 80, 0.75);
            border-color: rgba(0, 255, 120, 0.20);
        }
        
        .shadow-float-btn .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
        }
        
        .shadow-float-btn.active .dot {
            background: #4ade80;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.50);
        }
        
        @media (max-width: 640px) {
            .shadow-float-btn {
                bottom: 16px;
                padding: 8px 18px;
                font-size: 12px;
                border-radius: 24px;
            }
        }
    </style>
    <!-- ===== 样式结束 ===== -->
    
    <link rel="modulepreload" crossorigin href="/logo/milai-frame/assets/vendor.6ae0475c.js">
    <script type="module" crossorigin src="/logo/milai-frame/assets/index.796dc854.js"></script>
    
  </head>

  <body>
    <div id="app"></div>
    
    <!-- ===== 立体阴影控制逻辑 ===== -->
    <script>
        (function() {
            'use strict';
            
            const CONFIG = {
                retryInterval: 400,
                maxRetries: 25,
                debug: true
            };
            
            let isActive = false;
            let isInitialized = false;
            let controlBtn = null;
            let floatBtn = null;
            let retryCount = 0;
            let imageRenderEl = null;
            let canvasEl = null;
            
            function log(...args) {
                if (CONFIG.debug) console.log('[立体阴影]', ...args);
            }
            
            function findCanvasElements() {
                const app = document.querySelector('#app');
                if (!app) {
                    log('未找到 #app');
                    return null;
                }
                
                const canvas = app.querySelector('canvas.canvas');
                if (!canvas) {
                    log('未找到 canvas.canvas');
                    return null;
                }
                
                let imageRender = canvas.closest('.image-render');
                if (!imageRender) {
                    imageRender = app.querySelector('.image-render');
                }
                if (!imageRender) {
                    imageRender = canvas.parentElement;
                }
                
                return { canvas, imageRender };
            }
            
            function applyShadowToCanvas(elements) {
                if (!elements) return false;
                
                // 先清除所有标记
                document.querySelectorAll('.shadow-3d-active').forEach(el => {
                    el.classList.remove('shadow-3d-active');
                });
                
                // 对 .image-render 添加标记
                elements.imageRender.classList.add('shadow-3d-active');
                
                // 如果激活状态，重新应用
                if (isActive) {
                    elements.imageRender.classList.add('shadow-3d-active');
                }
                
                imageRenderEl = elements.imageRender;
                canvasEl = elements.canvas;
                
                log('阴影已应用到 canvas');
                return true;
            }
            
            function toggleShadow() {
                if (!imageRenderEl || !canvasEl) {
                    log('重新查找元素...');
                    const elements = findCanvasElements();
                    if (!elements) {
                        log('找不到目标元素');
                        return;
                    }
                    applyShadowToCanvas(elements);
                }
                
                isActive = !isActive;
                
                // 关键：直接对 Canvas 添加/移除类
                if (isActive) {
                    imageRenderEl.classList.add('shadow-3d-active');
                    // 强制重绘
                    canvasEl.style.transform = 'translateZ(0)';
                    requestAnimationFrame(() => {
                        canvasEl.style.transform = '';
                    });
                } else {
                    imageRenderEl.classList.remove('shadow-3d-active');
                }
                
                // 更新按钮
                if (controlBtn) {
                    controlBtn.classList.toggle('active', isActive);
                }
                if (floatBtn) {
                    floatBtn.classList.toggle('active', isActive);
                }
                
                log('阴影状态:', isActive ? '开启 ✅' : '关闭 ❌');
            }
            
            function tryIntegrateToPanel() {
                const controlArea = document.querySelector('.control-area');
                if (!controlArea) {
                    log('未找到 .control-area');
                    return false;
                }
                
                if (controlArea.querySelector('.shadow-control-btn')) {
                    return true;
                }
                
                // 查找插入位置
                let insertTarget = controlArea;
                const items = controlArea.querySelectorAll('*');
                for (let el of items) {
                    if (el.textContent && el.textContent.includes('边框')) {
                        insertTarget = el.parentElement || controlArea;
                        break;
                    }
                }
                
                controlBtn = document.createElement('span');
                controlBtn.className = 'shadow-control-btn';
                controlBtn.innerHTML = `
                    <span class="indicator"></span>
                    <span>立体阴影</span>
                `;
                controlBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                insertTarget.appendChild(controlBtn);
                log('已集成到功能面板');
                return true;
            }
            
            function createFloatButton() {
                const old = document.querySelector('.shadow-float-btn');
                if (old) old.remove();
                
                floatBtn = document.createElement('div');
                floatBtn.className = 'shadow-float-btn';
                floatBtn.innerHTML = `
                    <span>🔲</span>
                    <span>立体阴影</span>
                    <span class="dot"></span>
                `;
                floatBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                document.body.appendChild(floatBtn);
                log('已创建悬浮按钮');
                return floatBtn;
            }
            
            function watchOuterBorder() {
                document.addEventListener('click', function(e) {
                    const target = e.target;
                    if (!target) return;
                    
                    const text = target.textContent || '';
                    if (text.includes('使用外边框') || text.includes('外边框')) {
                        setTimeout(() => {
                            // 检测是否有外边框样式
                            if (canvasEl) {
                                const style = window.getComputedStyle(canvasEl);
                                const hasBorder = 
                                    style.borderWidth !== '0px' ||
                                    style.border !== 'none' ||
                                    style.outline !== 'none' ||
                                    imageRenderEl?.classList?.contains('border');
                                
                                if (hasBorder && !isActive) {
                                    log('检测到外边框开启，自动激活立体阴影');
                                    toggleShadow();
                                }
                            }
                        }, 500);
                    }
                });
            }
            
            function init() {
                if (isInitialized) return;
                
                retryCount++;
                log(`尝试 ${retryCount}/${CONFIG.maxRetries}`);
                
                const elements = findCanvasElements();
                if (!elements) {
                    if (retryCount < CONFIG.maxRetries) {
                        setTimeout(init, CONFIG.retryInterval);
                    } else {
                        log('初始化超时');
                    }
                    return;
                }
                
                // 先应用一次（默认关闭）
                applyShadowToCanvas(elements);
                
                // 集成到面板
                const integrated = tryIntegrateToPanel();
                if (!integrated) {
                    createFloatButton();
                }
                
                watchOuterBorder();
                
                // 暴露调试接口
                window.__shadow3d = {
                    toggle: toggleShadow,
                    enable: () => { if (!isActive) toggleShadow(); },
                    disable: () => { if (isActive) toggleShadow(); },
                    status: () => isActive,
                    find: findCanvasElements,
                    _elements: { imageRender: imageRenderEl, canvas: canvasEl }
                };
                
                isInitialized = true;
                log('初始化完成！');
                log('提示：执行 window.__shadow3d.toggle() 测试');
            }
            
            // 启动
            if (document.readyState === 'complete') {
                setTimeout(init, 500);
            } else {
                document.addEventListener('readystatechange', () => {
                    if (document.readyState === 'complete') {
                        setTimeout(init, 500);
                    }
                });
            }
            
            window.addEventListener('popstate', () => {
                setTimeout(() => {
                    if (isInitialized) {
                        const elements = findCanvasElements();
                        if (elements) {
                            applyShadowToCanvas(elements);
                            if (isActive) {
                                imageRenderEl.classList.add('shadow-3d-active');
                            }
                        }
                    }
                }, 400);
            });
            
        })();
    </script>
    <!-- ===== 控制逻辑结束 ===== -->
    
  </body>
</html>
