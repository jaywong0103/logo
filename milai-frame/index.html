<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo/milai-frame/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>milai边框</title>
    
    <!-- 原有的 CSS 资源 -->
    <link rel="stylesheet" href="/logo/milai-frame/assets/index.cfa8e624.css">
    
    <!-- ===== 新增：立体阴影边框样式 ===== -->
    <style>
        /* 立体阴影边框效果 - 应用于图片容器 */
        .milai-frame-shadow {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }
        
        /* 激活状态 - 多层级阴影营造立体感 */
        .milai-frame-shadow.active {
            box-shadow: 
                0 0 0 3px rgba(255, 255, 255, 0.9),      /* 内层亮边 */
                0 0 0 8px rgba(0, 0, 0, 0.10),           /* 中层柔和过渡 */
                0 0 0 12px rgba(0, 0, 0, 0.06),          /* 外层扩散 */
                0 8px 32px rgba(0, 0, 0, 0.35),          /* 主阴影 - 右下方向 */
                0 4px 16px rgba(0, 0, 0, 0.20);          /* 辅助阴影 - 底部加重 */
            
            /* 轻微的 3D 透视，增强立体感 */
            transform: perspective(800px) rotateX(0.8deg) rotateY(0.5deg);
        }
        
        /* 立体边框的装饰性内发光 */
        .milai-frame-shadow.active::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: inherit;
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .milai-frame-shadow.active::before {
            opacity: 1;
        }
        
        /* 鼠标悬停时增强立体感 - 互动反馈 */
        .milai-frame-shadow.active:hover {
            box-shadow: 
                0 0 0 3px rgba(255, 255, 255, 0.95),
                0 0 0 10px rgba(0, 0, 0, 0.08),
                0 0 0 16px rgba(0, 0, 0, 0.04),
                0 12px 48px rgba(0, 0, 0, 0.40),
                0 6px 24px rgba(0, 0, 0, 0.25);
            transform: perspective(800px) rotateX(1.2deg) rotateY(0.8deg) scale(1.005);
        }
        
        /* 控制按钮样式 - 简洁现代 */
        .shadow-toggle-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.10);
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }
        
        .shadow-toggle-btn:hover {
            transform: scale(1.06);
            background: rgba(40, 40, 40, 0.90);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }
        
        .shadow-toggle-btn.active {
            background: rgba(0, 180, 80, 0.85);
            border-color: rgba(0, 255, 120, 0.30);
        }
        
        .shadow-toggle-btn.active:hover {
            background: rgba(0, 200, 90, 0.90);
        }
        
        /* 响应式调整 */
        @media (max-width: 640px) {
            .shadow-toggle-btn {
                bottom: 16px;
                right: 16px;
                padding: 8px 14px;
                font-size: 12px;
                border-radius: 16px;
            }
        }
    </style>
    <!-- ===== 新增样式结束 ===== -->
    
    <!-- 预加载 JS 模块（原有） -->
    <link rel="modulepreload" crossorigin href="/logo/milai-frame/assets/vendor.6ae0475c.js">
    
    <!-- 原有的 JS 主模块 -->
    <script type="module" crossorigin src="/logo/milai-frame/assets/index.796dc854.js"></script>
    
  </head>

  <body>
    <div id="app"></div>
    
    <!-- ===== 新增：立体阴影边框控制逻辑 ===== -->
    <script>
        (function() {
            'use strict';
            
            // 等待 Vue 应用挂载完成
            let targetElement = null;
            let isInitialized = false;
            let controlBtn = null;
            
            // 查找目标元素的函数
            function findTargetElement() {
                const app = document.querySelector('#app');
                if (!app) return null;
                
                // 策略1: 查找包含图片的主要容器
                const img = app.querySelector('img');
                if (img) {
                    // 如果 img 有父容器且尺寸较大，使用父容器
                    const parent = img.parentElement;
                    if (parent && parent !== app) {
                        const rect = parent.getBoundingClientRect();
                        if (rect.width > 50 && rect.height > 50) {
                            return parent;
                        }
                    }
                    // 否则直接使用 img 本身
                    return img;
                }
                
                // 策略2: 查找带有图片背景或尺寸较大的 div
                const divs = app.querySelectorAll('div');
                for (let div of divs) {
                    const style = window.getComputedStyle(div);
                    const bgImage = style.backgroundImage;
                    if (bgImage && bgImage !== 'none' && bgImage.includes('url')) {
                        const rect = div.getBoundingClientRect();
                        if (rect.width > 100 && rect.height > 100) {
                            return div;
                        }
                    }
                }
                
                // 策略3: 查找最大的可见元素（作为备选）
                let largest = null;
                let maxArea = 0;
                for (let div of divs) {
                    const rect = div.getBoundingClientRect();
                    const area = rect.width * rect.height;
                    if (area > maxArea && rect.width > 100 && rect.height > 100) {
                        maxArea = area;
                        largest = div;
                    }
                }
                
                return largest || app;
            }
            
            // 初始化阴影功能
            function initShadowFeature() {
                if (isInitialized) return;
                
                targetElement = findTargetElement();
                if (!targetElement) {
                    console.warn('[立体阴影] 未找到目标元素，稍后重试...');
                    setTimeout(initShadowFeature, 500);
                    return;
                }
                
                // 添加阴影类
                targetElement.classList.add('milai-frame-shadow');
                console.log('[立体阴影] 已绑定到元素:', targetElement.tagName, targetElement.className);
                
                // 创建控制按钮
                controlBtn = document.createElement('div');
                controlBtn.className = 'shadow-toggle-btn';
                controlBtn.textContent = '✨ 立体阴影';
                controlBtn.setAttribute('role', 'button');
                controlBtn.setAttribute('aria-label', '切换立体阴影边框效果');
                
                controlBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleShadow();
                });
                
                document.body.appendChild(controlBtn);
                console.log('[立体阴影] 控制按钮已添加');
                
                // 尝试与原边框开关联动
                setupBorderSwitchListener();
                
                isInitialized = true;
            }
            
            // 切换阴影状态
            function toggleShadow() {
                if (!targetElement) return;
                targetElement.classList.toggle('active');
                const isActive = targetElement.classList.contains('active');
                controlBtn.classList.toggle('active', isActive);
                controlBtn.textContent = isActive ? '✨ 立体阴影 ✦' : '✨ 立体阴影';
                console.log('[立体阴影] 状态:', isActive ? '开启' : '关闭');
            }
            
            // 监听原边框开关
            function setupBorderSwitchListener() {
                // 使用 MutationObserver 检测元素变化
                const observer = new MutationObserver(function(mutations) {
                    // 检查目标元素的样式变化
                    const hasBorderStyle = 
                        targetElement.style.border !== '' && targetElement.style.border !== 'none' ||
                        targetElement.style.outline !== '' && targetElement.style.outline !== 'none' ||
                        targetElement.style.boxShadow !== '' && targetElement.style.boxShadow !== 'none';
                    
                    // 检查是否包含边框相关的类
                    const hasBorderClass = 
                        targetElement.classList.contains('border') ||
                        targetElement.classList.contains('has-border') ||
                        targetElement.classList.contains('frame') ||
                        targetElement.classList.contains('bordered');
                    
                    // 如果检测到边框开启，自动激活阴影
                    if (hasBorderStyle || hasBorderClass) {
                        if (!targetElement.classList.contains('active')) {
                            targetElement.classList.add('active');
                            controlBtn.classList.add('active');
                            controlBtn.textContent = '✨ 立体阴影 ✦';
                            console.log('[立体阴影] 检测到外边框开启，自动激活立体阴影');
                        }
                    }
                });
                
                // 观察目标元素和 #app
                observer.observe(targetElement, {
                    attributes: true,
                    attributeFilter: ['class', 'style'],
                    childList: false,
                    subtree: false
                });
                
                // 也观察 #app 的变化（Vue 可能会重建 DOM）
                const app = document.querySelector('#app');
                if (app && app !== targetElement) {
                    const appObserver = new MutationObserver(function() {
                        // 如果目标元素被替换，重新查找
                        const newTarget = findTargetElement();
                        if (newTarget && newTarget !== targetElement) {
                            // 转移状态到新元素
                            const wasActive = targetElement.classList.contains('active');
                            targetElement.classList.remove('milai-frame-shadow', 'active');
                            targetElement = newTarget;
                            targetElement.classList.add('milai-frame-shadow');
                            if (wasActive) {
                                targetElement.classList.add('active');
                            }
                            console.log('[立体阴影] 重新绑定到新元素');
                        }
                    });
                    appObserver.observe(app, {
                        childList: true,
                        subtree: true
                    });
                }
            }
            
            // 当 DOM 加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    // 延迟执行，等待 Vue 渲染
                    setTimeout(initShadowFeature, 800);
                });
            } else {
                // DOM 已加载
                setTimeout(initShadowFeature, 800);
            }
            
            // 额外的安全措施：如果 Vue 加载慢，多次重试
            let retryCount = 0;
            const maxRetries = 10;
            const retryInterval = setInterval(function() {
                if (isInitialized) {
                    clearInterval(retryInterval);
                    return;
                }
                retryCount++;
                if (retryCount > maxRetries) {
                    clearInterval(retryInterval);
                    console.warn('[立体阴影] 初始化超时，请手动点击按钮尝试');
                    return;
                }
                const el = findTargetElement();
                if (el && el.querySelector('img') !== null) {
                    initShadowFeature();
                }
            }, 600);
            
            // 暴露控制接口到全局，方便调试
            window.__milaiShadow = {
                toggle: toggleShadow,
                enable: function() {
                    if (targetElement) {
                        targetElement.classList.add('active');
                        controlBtn.classList.add('active');
                        controlBtn.textContent = '✨ 立体阴影 ✦';
                    }
                },
                disable: function() {
                    if (targetElement) {
                        targetElement.classList.remove('active');
                        controlBtn.classList.remove('active');
                        controlBtn.textContent = '✨ 立体阴影';
                    }
                },
                status: function() {
                    return targetElement ? targetElement.classList.contains('active') : false;
                }
            };
            
            console.log('[立体阴影] 已加载，可通过 window.__milaiShadow 控制');
        })();
    </script>
    <!-- ===== 新增控制逻辑结束 ===== -->
    
  </body>
</html>
